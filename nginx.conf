server {
    listen 80;
    server_name localhost;

    # Directorio donde están los archivos estáticos
    root /usr/share/nginx/html;
    index index.html;

    # ⚠️ Clave para React Router con BrowserRouter:
    # Si la ruta no existe como archivo, sirve index.html
    # Así /about, /contact, etc. funcionan correctamente
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estáticos (imágenes, JS, CSS)
    location ~* \.(js|css|png|jpg|jpeg|webp|gif|svg|ico|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Compresión gzip para mejorar rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
